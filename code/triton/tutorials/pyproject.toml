[project]
name = "triton-tutorials"
version = "0.1.0"
description = "Environment for the Triton vector addition tutorial"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "einops>=0.8.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "nbclient>=0.10,<1",
]
